kind = "mobile"
previewPath = "/mobile/"
title = "PointHive Mobile"
version = "1.0.0"
id = "artifacts/loyalty-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22240

[services.development]
run = "pnpm --filter @workspace/loyalty-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/loyalty-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/loyalty-mobile", "run", "serve" ]

[services.env]
PORT = "22240"
BASE_PATH = "/mobile/"
